name: CesiumAstro
description: 'CesiumAstro designs, manufactures, and tests full-stack communication
  systems and satellites for space, air, and ground missions. The Austin, Texas company,
  founded in 2017, builds active phased array payloads (Vireo), software-defined radios
  (SDR-1001/2051/2104/3104), reconfigurable processing units, SATCOM terminals (Skylark),
  tactical ISR/PNT payloads (Nightingale), and the integrated Element LEO satellite
  platform. Its hardware enables inter-satellite links, high-speed downlinks, lunar
  communications, and 5G non-terrestrial networks. CesiumAstro publishes no public
  developer API, SDK, or documentation portal; this profile tracks the company as an
  aerospace hardware provider in the API Evangelist network.'
